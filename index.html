<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieMania</title>

<!-- ===== Popunder Ad ===== -->
<script src="https://munchinexorable.com/75/0a/a6/750aa6f080f6c3823b0817d364bfa7b9.js"></script>

<style>
  /* ===== থিম: Neon Cyberpunk ===== */
  :root {
    --bg: #0a0a0f;
    --bg-2: #12121c;
    --bg-3: #1a1a2e;
    --card: #16162a;
    --card-hover: #1e1e38;
    --accent: #00f0ff;
    --accent-2: #ff006e;
    --accent-3: #ffbe0b;
    --text: #e8e8f0;
    --text-dim: #8a8aa0;
    --border: #2a2a45;
    --glow: 0 0 20px rgba(0,240,255,.35);
    --glow-2: 0 0 25px rgba(255,0,110,.45);
  }

  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:var(--bg); color:var(--text); }

  header {
    background:linear-gradient(135deg, #0a0a0f 0%, #12121c 50%, #1a1a2e 100%);
    padding:15px 30px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:15px;
    position:sticky; top:0; z-index:100;
    border-bottom:1px solid var(--border);
    box-shadow:0 4px 30px rgba(0,240,255,.08);
  }
  .logo {
    font-size:26px; font-weight:bold;
    color:var(--accent);
    cursor:pointer;
    text-shadow:0 0 10px rgba(0,240,255,.6), 0 0 20px rgba(0,240,255,.3);
    letter-spacing:1px;
  }
  .logo span {
    color:var(--accent-2);
    text-shadow:0 0 10px rgba(255,0,110,.7), 0 0 20px rgba(255,0,110,.4);
  }

  .search-box { display:flex; flex:1; max-width:500px; }
  .search-box input {
    flex:1; padding:10px 15px;
    border:1px solid var(--border);
    border-right:none;
    border-radius:25px 0 0 25px;
    background:var(--bg-3);
    color:var(--text);
    outline:none; font-size:15px;
    transition:all .3s;
  }
  .search-box input:focus {
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(0,240,255,.25);
  }
  .search-box input::placeholder { color:var(--text-dim); }
  .search-box button {
    padding:10px 20px;
    border:none;
    border-radius:0 25px 25px 0;
    background:linear-gradient(135deg, var(--accent), #0099cc);
    color:#000; cursor:pointer; font-weight:bold;
    transition:all .3s;
  }
  .search-box button:hover {
    box-shadow:0 0 20px rgba(0,240,255,.6);
    transform:scale(1.03);
  }

  nav {
    display:flex; gap:10px; flex-wrap:wrap;
    padding:15px 30px;
    background:var(--bg-2);
    border-bottom:1px solid var(--border);
  }
  nav button {
    padding:8px 18px;
    border:1px solid var(--border);
    border-radius:20px;
    background:transparent;
    color:var(--text-dim);
    cursor:pointer; font-size:14px;
    transition:all .3s;
  }
  nav button:hover {
    color:var(--accent);
    border-color:var(--accent);
    box-shadow:0 0 12px rgba(0,240,255,.3);
  }
  nav button.active {
    background:linear-gradient(135deg, var(--accent), #0099cc);
    color:#000;
    border-color:var(--accent);
    font-weight:bold;
    box-shadow:0 0 18px rgba(0,240,255,.5);
  }

  .container { padding:20px 30px 60px; }

  .section-title {
    font-size:22px;
    margin:25px 0 15px;
    padding-left:12px;
    border-left:4px solid var(--accent-2);
    text-shadow:0 0 12px rgba(255,0,110,.4);
  }

  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:20px;
  }

  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .3s, box-shadow .3s, border-color .3s;
    position:relative;
  }
  .card:hover {
    transform:translateY(-6px);
    border-color:var(--accent);
    box-shadow:0 10px 30px rgba(0,240,255,.25), 0 0 0 1px rgba(0,240,255,.3);
  }
  .card img {
    width:100%; height:240px;
    object-fit:cover; display:block;
    background:#222;
  }
  .card-info { padding:10px; }
  .card-info h3 {
    font-size:14px; margin-bottom:5px;
    white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis;
  }
  .card-info p {
    font-size:12px; color:var(--text-dim);
    display:flex; justify-content:space-between;
  }
  .rating { color:var(--accent-3); font-weight:bold; }

  .badge {
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,.85);
    padding:3px 8px;
    border-radius:12px;
    font-size:11px;
    color:var(--accent-3);
    font-weight:bold;
    border:1px solid rgba(255,190,11,.4);
    backdrop-filter:blur(4px);
  }

  .loading {
    text-align:center; padding:40px;
    color:var(--text-dim);
  }
  .spinner {
    width:45px; height:45px;
    border:4px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 15px;
    box-shadow:0 0 20px rgba(0,240,255,.3);
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .modal {
    display:none; position:fixed; inset:0;
    background:rgba(5,5,10,.92);
    z-index:200; overflow-y:auto;
    padding:30px 15px;
    backdrop-filter:blur(6px);
  }
  .modal.open { display:block; }
  .modal-content {
    max-width:900px; margin:0 auto;
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden; position:relative;
    box-shadow:0 0 60px rgba(0,240,255,.15);
  }
  .modal-close {
    position:absolute; top:12px; right:12px;
    background:var(--accent-2);
    color:#fff; border:none;
    width:36px; height:36px;
    border-radius:50%; cursor:pointer;
    font-size:18px; font-weight:bold; z-index:10;
    transition:all .3s;
  }
  .modal-close:hover {
    box-shadow:0 0 20px rgba(255,0,110,.7);
    transform:rotate(90deg);
  }
  .modal-hero {
    display:flex; gap:20px; padding:25px;
    flex-wrap:wrap;
    background:linear-gradient(135deg, #12121c, #0a0a0f);
  }
  .modal-hero img {
    width:200px; border-radius:10px;
    border:1px solid var(--border);
  }
  .modal-hero .details { flex:1; min-width:250px; }
  .modal-hero h2 {
    font-size:26px; margin-bottom:10px;
    color:var(--accent);
    text-shadow:0 0 15px rgba(0,240,255,.4);
  }
  .modal-hero .meta {
    color:var(--text-dim);
    font-size:14px; margin-bottom:15px;
  }
  .modal-hero .overview {
    line-height:1.6; color:#ccc;
    font-size:14px; margin-bottom:15px;
  }
  .genres { display:flex; gap:8px; flex-wrap:wrap; }
  .genres span {
    background:linear-gradient(135deg, var(--accent-2), #cc0058);
    padding:4px 12px; border-radius:15px;
    font-size:12px;
    box-shadow:0 0 12px rgba(255,0,110,.35);
  }

  .error-box {
    color:var(--accent-2);
    padding:20px;
    background:var(--card);
    border-radius:10px;
    border-left:4px solid var(--accent-2);
  }
  .error-box h3 { margin-bottom:8px; }
  .error-box p { color:var(--text-dim); font-size:14px; margin-top:8px; }
  .error-box a { color:var(--accent-3); }

  /* ===== Native Banner Ad Styling ===== */
  .ad-container {
    grid-column:1/-1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    background:var(--bg-2);
    border:1px dashed var(--border);
    border-radius:12px;
    margin:5px 0;
    min-height:100px;
  }
  .ad-container::before {
    content:'Advertisement';
    position:absolute;
    font-size:10px;
    color:var(--text-dim);
    top:5px;
    left:10px;
    letter-spacing:1px;
  }
  .ad-container { position:relative; }

  @media (max-width:600px){
    header{padding:12px 15px;}
    .logo{font-size:20px;}
    .search-box{order:3;flex:1 0 100%;}
    nav,.container{padding-left:15px;padding-right:15px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
    .card img{height:190px;}
    .modal-hero{flex-direction:column;}
    .modal-hero img{width:100%;max-width:250px;margin:0 auto;}
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="loadCategory('trending', document.querySelector('nav button'))">
    Movie<span>Mania</span>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="মুভি বা টিভি শো খুঁজুন..." onkeypress="if(event.key==='Enter') doSearch()">
    <button onclick="doSearch()">🔍</button>
  </div>
</header>

<nav>
  <button class="active" onclick="loadCategory('trending', this)">🔥 Trending</button>
  <button onclick="loadCategory('popular', this)">⭐ Popular</button>
  <button onclick="loadCategory('top_rated', this)">🏆 Top Rated</button>
  <button onclick="loadCategory('upcoming', this)">🎬 Upcoming</button>
  <button onclick="loadCategory('now_playing', this)">🎥 Now Playing</button>
  <button onclick="loadTV(this)">📺 TV Shows</button>
</nav>

<div class="container">
  <h2 class="section-title" id="sectionTitle">🔥 Trending Movies</h2>
  <div id="results" class="grid"></div>
  <div id="loading" class="loading" style="display:none;">
    <div class="spinner"></div>
    লোড হচ্ছে...
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ===== Social Bar Ad ===== -->
<script src="https://munchinexorable.com/82/7d/b9/827db9af6e84ef7cc115e5f1242d8a90.js"></script>

<script>
const CFG = {
  API_KEY: '05902896074695709d7763505bb88b4d',
  BASE: 'https://api.themoviedb.org/3',
  IMG: 'https://image.tmdb.org/t/p/w500',
  IMG_ORIG: 'https://image.tmdb.org/t/p/original',
  // ===== Smartlink URL =====
  SMARTLINK: 'https://munchinexorable.com/yhhfigubzp?key=43baa875ab1fd6e063529d95926af941'
};

const resultsEl = document.getElementById('results');
const loadingEl = document.getElementById('loading');
const titleEl = document.getElementById('sectionTitle');
const modalEl = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');

// ===== Native Banner Ad HTML =====
const NATIVE_BANNER_HTML = `
  <div class="ad-container">
    <script async="async" data-cfasync="false" src="https://munchinexorable.com/a5124b29140328ce66fdf8735b5e5a95/invoke.js"><\/script>
    <div id="container-a5124b29140328ce66fdf8735b5e5a95"></div>
  </div>
`;

// ===== Native Banner এড়িয়ে যাওয়ার জন্য ট্র্যাকিং =====
let adInserted = false;

async function tmdb(path, params = '') {
  const url = `${CFG.BASE}${path}?api_key=${CFG.API_KEY}&language=en-US${params}`;
  console.log('📡 Fetching:', url);
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) {
    console.error('❌ TMDB Error:', data);
    throw new Error(data.status_message || `HTTP ${res.status}`);
  }
  return data;
}

function showLoading(show) {
  loadingEl.style.display = show ? 'block' : 'none';
  if (show) resultsEl.innerHTML = '';
}

function showError(msg) {
  resultsEl.innerHTML = `
    <div class="error-box" style="grid-column:1/-1;">
      <h3>⚠️ ডেটা লোড করতে সমস্যা হয়েছে</h3>
      <p><b>কারণ:</b> ${msg}</p>
      <p>
        🔍 <b>API key টেস্ট করুন:</b>
        <a href="https://api.themoviedb.org/3/trending/movie/day?api_key=${CFG.API_KEY}" target="_blank">
          এই লিংকে ক্লিক করুন
        </a>
      </p>
      <p>💡 F12 চেপে Console ট্যাবে actual error দেখুন।</p>
    </div>`;
}

function renderCards(items, type = 'movie') {
  if (!items || !items.length) {
    resultsEl.innerHTML = '<p style="color:#888">কোনো ফলাফল পাওয়া যায়নি।</p>';
    return;
  }

  let cardsHTML = items.map((item, index) => {
    const title = item.title || item.name || 'Untitled';
    const date = (item.release_date || item.first_air_date || '').slice(0, 4);
    const poster = item.poster_path ? CFG.IMG + item.poster_path : 'https://via.placeholder.com/300x450/1a1a2e/666?text=No+Image';
    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
    const mediaType = item.media_type || type;

    // ===== প্রতি ৮টি কার্ডের পরে Native Banner Ad =====
    let adHTML = '';
    if (index > 0 && index % 8 === 0) {
      adHTML = NATIVE_BANNER_HTML;
    }

    return adHTML + `
      <div class="card" onclick="openDetails(${item.id}, '${mediaType}')">
        <span class="badge">⭐ ${rating}</span>
        <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/1a1a2e/666?text=No+Image'">
        <div class="card-info">
          <h3 title="${title}">${title}</h3>
          <p><span>${date || '—'}</span><span class="rating">⭐ ${rating}</span></p>
        </div>
      </div>`;
  }).join('');

  // ===== একদম শেষে আরেকটি Native Banner Ad =====
  cardsHTML += NATIVE_BANNER_HTML;

  resultsEl.innerHTML = cardsHTML;

  // ===== Native Banner স্ক্রিপ্ট পুনরায় লোড (innerHTML এর কারণে) =====
  reloadNativeBanners();
}

// ===== Native Banner স্ক্রিপ্ট পুনরায় এক্সিকিউট =====
function reloadNativeBanners() {
  const containers = resultsEl.querySelectorAll('.ad-container script');
  containers.forEach(oldScript => {
    const newScript = document.createElement('script');
    newScript.async = true;
    newScript.setAttribute('data-cfasync', 'false');
    newScript.src = oldScript.src;
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
}

// ===== Smartlink ওপেন করার ফাংশন =====
function openSmartlink() {
  window.open(CFG.SMARTLINK, '_blank');
}

async function loadCategory(cat, btn) {
  setActiveNav(btn);
  const endpoints = {
    trending:    ['/trending/movie/day', '🔥 Trending Movies'],
    popular:     ['/movie/popular',      '⭐ Popular Movies'],
    top_rated:   ['/movie/top_rated',    '🏆 Top Rated Movies'],
    upcoming:    ['/movie/upcoming',     '🎬 Upcoming Movies'],
    now_playing: ['/movie/now_playing',  '🎥 Now Playing']
  };
  const [endpoint, title] = endpoints[cat] || ['/movie/popular', 'Movies'];
  titleEl.textContent = title;
  showLoading(true);
  try {
    const data = await tmdb(endpoint);
    renderCards(data.results, 'movie');
  } catch (e) {
    showError(e.message);
  } finally {
    showLoading(false);
  }
}

async function loadTV(btn) {
  setActiveNav(btn);
  titleEl.textContent = '📺 Popular TV Shows';
  showLoading(true);
  try {
    const data = await tmdb('/tv/popular');
    renderCards(data.results, 'tv');
  } catch (e) {
    showError(e.message);
  } finally {
    showLoading(false);
  }
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  titleEl.textContent = `🔍 অনুসন্ধান: "${q}"`;
  showLoading(true);
  try {
    const data = await tmdb('/search/multi', `&query=${encodeURIComponent(q)}`);
    const filtered = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv');
    renderCards(filtered, 'movie');
  } catch (e) {
    showError(e.message);
  } finally {
    showLoading(false);
  }
}

function setActiveNav(btn) {
  if (!btn) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function openDetails(id, type) {
  modalEl.classList.add('open');
  modalBody.innerHTML = '<div class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>';
  document.body.style.overflow = 'hidden';
  try {
    const d = await tmdb(`/${type}/${id}`);
    const title = d.title || d.name;
    const poster = d.poster_path ? CFG.IMG + d.poster_path : 'https://via.placeholder.com/300x450/1a1a2e/666?text=No+Image';
    const backdrop = d.backdrop_path ? CFG.IMG_ORIG + d.backdrop_path : poster;
    const genres = (d.genres || []).map(g => `<span>${g.name}</span>`).join('');
    const date = d.release_date || d.first_air_date || '';
    const runtime = d.runtime ? `${d.runtime} min` : (d.number_of_seasons ? `${d.number_of_seasons} Season(s)` : '');

    // ===== Watch Now বাটন সহ মোডাল =====
    modalBody.innerHTML = `
      <div style="height:250px;background:url('${backdrop}') center/cover;position:relative;">
        <div style="position:absolute;inset:0;background:linear-gradient(to top, #12121c, transparent);"></div>
      </div>
      <div class="modal-hero" style="margin-top:-60px;position:relative;">
        <img src="${poster}" alt="${title}">
        <div class="details">
          <h2>${title}</h2>
          <div class="meta">
            ${date ? '📅 ' + date + ' • ' : ''}
            ${runtime ? '⏱ ' + runtime + ' • ' : ''}
            ⭐ ${(d.vote_average || 0).toFixed(1)}/10
          </div>
          <p class="overview">${d.overview || 'কোনো বিবরণ নেই।'}</p>
          <div class="genres">${genres}</div>
          <button onclick="openSmartlink()" style="margin-top:20px;padding:12px 28px;background:linear-gradient(135deg,var(--accent-2),#cc0058);color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px rgba(255,0,110,.5);transition:all .3s;">
            ▶️ Watch Now
          </button>
        </div>
      </div>`;
  } catch (e) {
    modalBody.innerHTML = `<div class="loading" style="color:#ff006e">❌ ${e.message}</div>`;
  }
}

function closeModal() {
  modalEl.classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

loadCategory('trending', document.querySelector('nav button'));
</script>
</body>
</html>
